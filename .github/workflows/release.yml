name: Release build (signed)

# Builds a signed release APK, verifies it is signed with the persistent AGI Assistant release key,
# uploads it as a workflow artifact and – on a v* tag, or a manual run with publish=true – publishes
# it as a GitHub Release "v<versionName>" with the APK, its .sha256 checksum and generated notes.
# GitHub Releases are the official update channel read by the in-app updater
# (core/update/GitHubReleaseUpdateChecker.kt → /releases/latest). Workflow artifacts are never used
# for updates. Re-running for an already published version re-uploads the assets (idempotent).
#
# Secrets (repository → Settings → Secrets → Actions):
#   AGI_RELEASE_KEYSTORE_BASE64   base64 of the JKS/PKCS12 keystore (never committed)
#   AGI_RELEASE_STORE_PASSWORD    keystore password
#   AGI_RELEASE_KEY_ALIAS         key alias
#   AGI_RELEASE_KEY_PASSWORD      key password (same as store password for PKCS12)
# None of these values are ever echoed; the decoded keystore lives in $RUNNER_TEMP and is deleted.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the verified APK as GitHub Release v<versionName>"
        type: boolean
        default: false
  push:
    tags: ["v*"]
    branches: ["**"]
    paths-ignore: ["**.md", "dist/**"]

permissions:
  contents: write   # needed only by the "Publish GitHub Release" step (tag + release + assets)

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Persistent release certificate. A build signed with any other key fails the workflow.
  EXPECTED_CERT_SHA256: "5F:25:0D:82:3B:07:65:71:67:CF:7F:F9:41:E1:BB:5E:37:0C:D7:A9:5C:0E:E5:A9:D4:55:12:F2:F3:29:8E:8C"
  EXPECTED_APPLICATION_ID: com.agi.assistant

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: "8.7" }

      - name: Check signing secrets are configured
        shell: bash
        env:
          KS_B64: ${{ secrets.AGI_RELEASE_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.AGI_RELEASE_STORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.AGI_RELEASE_KEY_ALIAS }}
        run: |
          set +x
          missing=""
          [ -n "$KS_B64" ]   || missing="$missing AGI_RELEASE_KEYSTORE_BASE64"
          [ -n "$KS_PASS" ]  || missing="$missing AGI_RELEASE_STORE_PASSWORD"
          [ -n "$KS_ALIAS" ] || missing="$missing AGI_RELEASE_KEY_ALIAS"
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing"; exit 1; fi
          echo "All signing secrets present (values not shown)."

      - name: Decode release keystore to a temporary file
        shell: bash
        env:
          KS_B64: ${{ secrets.AGI_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set +x
          umask 077
          KS="$RUNNER_TEMP/agi-release.keystore"
          printf '%s' "$KS_B64" | tr -d '\n\r ' | base64 -d > "$KS"
          [ -s "$KS" ] || { echo "::error::Decoded keystore is empty – check AGI_RELEASE_KEYSTORE_BASE64"; exit 1; }
          echo "AGI_RELEASE_KEYSTORE_FILE=$KS" >> "$GITHUB_ENV"
          echo "Keystore decoded to a temporary file ($(stat -c %s "$KS") bytes)."

      - name: Compile (debug + unit-test sources)
        shell: bash
        run: |
          set -o pipefail
          if ! gradle --no-daemon --console=plain --stacktrace compileDebugKotlin compileDebugUnitTestKotlin 2>&1 | tee /tmp/compile.log; then
            { echo "### Compile failed"; echo '```'; grep -E "^e: |error:|What went wrong|Caused by|Could not|Unresolved" /tmp/compile.log | head -60; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            grep -E "^e: " /tmp/compile.log | head -20 | sed 's/^e: /::error::/'
            exit 1
          fi

      - name: Run JVM test suites
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain coreTests 2>&1 | tee /tmp/coreTests.log | grep -E "passed|FAIL|BUILD|> Task :app:run|e: |What went wrong|Caused by|Exception" || true
          grep -q "BUILD SUCCESSFUL" /tmp/coreTests.log || { echo "::error::coreTests failed – full log follows"; tail -80 /tmp/coreTests.log; exit 1; }
          python3 scripts/mock_ai_server.py 8089 /tmp/mock_ai_last.json & MOCK=$!
          sleep 1
          gradle --no-daemon --console=plain providerWireTest -PmockUrl=http://127.0.0.1:8089 -PmockLog=/tmp/mock_ai_last.json 2>&1 | tee /tmp/wire.log | grep -E "passed|FAIL|BUILD|What went wrong|Exception" || true
          kill $MOCK || true
          grep -q "BUILD SUCCESSFUL" /tmp/wire.log || { echo "::error::providerWireTest failed – full log follows"; tail -80 /tmp/wire.log; exit 1; }

      - name: Lint (report only)
        run: gradle --no-daemon --console=plain lintRelease

      - name: Build signed release APK
        shell: bash
        env:
          AGI_RELEASE_STORE_PASSWORD: ${{ secrets.AGI_RELEASE_STORE_PASSWORD }}
          AGI_RELEASE_KEY_ALIAS: ${{ secrets.AGI_RELEASE_KEY_ALIAS }}
          AGI_RELEASE_KEY_PASSWORD: ${{ secrets.AGI_RELEASE_KEY_PASSWORD }}
        run: |
          set +x
          gradle --no-daemon --console=plain assembleRelease
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          [ -f "$APK" ] || { echo "::error::No release APK produced"; exit 1; }
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Verify signature, certificate fingerprint and package metadata
        shell: bash
        run: |
          set +e
          S="$GITHUB_STEP_SUMMARY"; mkdir -p diag
          fail() { echo "::error::$1"; echo "❌ $1" | tee -a "$S" >> diag/verify.log; exit 1; }
          echo "### Release verification" >> "$S"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BTV=$(ls "$SDK/build-tools" 2>/dev/null | sort -V | tail -1); BT="$SDK/build-tools/$BTV"
          echo "sdk=$SDK build-tools=$BTV apk=${APK:-<unset>}" | tee -a "$S" diag/verify.log
          [ -x "$BT/apksigner" ] || fail "apksigner not found under $BT"
          [ -f "${APK:-}" ] || fail "APK path not set / file missing (env APK='${APK:-}')"
          "$BT/apksigner" verify --verbose --print-certs "$APK" > /tmp/verify.txt 2>&1; RC=$?
          cat /tmp/verify.txt | tee -a diag/verify.log
          { echo '```'; grep -E "^Verifie|certificate SHA-256|WARNING|DOES NOT" /tmp/verify.txt | head -20; echo '```'; } >> "$S"
          # Surface the apksigner output as annotations (visible via API even when logs are not).
          grep -E "^Verifie|certificate|WARNING|DOES NOT|ERROR|Exception" /tmp/verify.txt | head -12 | while IFS= read -r l; do echo "::notice title=apksigner::$l"; done
          [ $RC -eq 0 ] || fail "apksigner verify exited $RC"
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" /tmp/verify.txt || fail "v2 signature missing"
          grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" /tmp/verify.txt || fail "v3 signature missing"
          grep -q "Verified using v1 scheme (JAR signing): true" /tmp/verify.txt && echo "v1 present" >> "$S" || echo "v1 (JAR) absent – not required for minSdk 26" >> "$S"
          # apksigner prints one line per scheme, e.g.
          #   "Signer #1 certificate SHA-256 digest: <hex>"  or  "V3.0 Signer: certificate SHA-256 digest: <hex>"
          # Match any of them on the "certificate SHA-256 digest:" marker and take the 64-hex digest.
          DIGESTS=$(grep -i "certificate SHA-256 digest:" /tmp/verify.txt | grep -oiE '[0-9a-f]{64}' | tr 'a-f' 'A-F' | sort -u || true)
          [ -n "$DIGESTS" ] || fail "apksigner printed no 'certificate SHA-256 digest:' line – cannot verify signer"
          RAW=$(echo "$DIGESTS" | head -1)
          ACTUAL=$(echo "$RAW" | sed 's/../&:/g; s/:$//')
          EXPECTED=$(echo "$EXPECTED_CERT_SHA256" | tr 'a-f' 'A-F')
          { echo "expected certificate: $EXPECTED"; echo "actual certificate:   $ACTUAL"; } | tee -a "$S"
          [ -n "$ACTUAL" ] || fail "could not read signer certificate from apksigner output"
          [ "$ACTUAL" = "$EXPECTED" ] || fail "Release APK is NOT signed with the persistent release key"
          # Exactly one signer: every scheme (v2/v3) must report the same single certificate.
          SIGNERS=$(echo "$DIGESTS" | grep -c . || true)
          [ "$SIGNERS" -eq 1 ] || fail "Expected exactly one signer certificate, found $SIGNERS distinct"
          "$BT/zipalign" -c -p 4 "$APK" || fail "zipalign check failed"
          echo "zipalign OK" >> "$S"
          "$BT/aapt2" dump badging "$APK" > /tmp/badging.txt 2>&1 || fail "aapt2 dump badging failed"
          head -1 /tmp/badging.txt | tee -a "$S"
          grep -q "package: name='$EXPECTED_APPLICATION_ID'" /tmp/badging.txt || fail "applicationId mismatch"
          VN=$(grep -oP "versionName='\K[^']+" /tmp/badging.txt | head -1); VC=$(grep -oP "versionCode='\K[^']+" /tmp/badging.txt | head -1)
          GVN=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts); GVC=$(grep -oP 'versionCode = \K\d+' app/build.gradle.kts)
          [ "$VN" = "$GVN" ] && [ "$VC" = "$GVC" ] || fail "APK version $VN ($VC) != build.gradle.kts $GVN ($GVC)"
          OUT="agi-assistant-$VN-release.apk"; mkdir -p out; cp "$APK" "out/$OUT"
          (cd out && sha256sum "$OUT" > "$OUT.sha256" && cat "$OUT.sha256") | tee -a "$S"
          echo "APK_NAME=$OUT" >> "$GITHUB_ENV"
          echo "APK_VERSION_NAME=$VN" >> "$GITHUB_ENV"
          echo "APK_VERSION_CODE=$VC" >> "$GITHUB_ENV"
          echo "✅ signed with the persistent release key; versionName $VN, versionCode $VC" >> "$S"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: |
            out/*.apk
            out/*.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release (official update channel)
        # Publishing is a deliberate act: a pushed v* tag or a manual run with publish=true.
        # Ordinary branch pushes only build, test and verify (the artifact is still uploaded).
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish == true)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          S="$GITHUB_STEP_SUMMARY"
          VN="$APK_VERSION_NAME"; VC="$APK_VERSION_CODE"; TAG="v$VN"
          SHA=$(cut -d' ' -f1 "out/$APK_NAME.sha256")
          [[ "$SHA" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::checksum file malformed"; exit 1; }
          # A pushed tag must match the APK version – refuse to publish v0.2.1 assets under a v0.3.0 tag.
          if [[ "$GITHUB_REF" == refs/tags/* ]] && [ "${GITHUB_REF#refs/tags/}" != "$TAG" ]; then
            echo "::error::Tag ${GITHUB_REF#refs/tags/} does not match APK versionName $VN (expected $TAG)"; exit 1
          fi
          scripts/release_notes.sh "$VN" "$VC" "$APK_NAME" "$SHA" CHANGELOG.md > out/RELEASE_NOTES.md
          echo "### GitHub Release $TAG" >> "$S"
          if gh release view "$TAG" --json tagName >/dev/null 2>&1; then
            # Same version rebuilt: refresh assets + notes so the release always matches the newest signed build.
            echo "Release $TAG exists – updating notes and replacing assets." | tee -a "$S"
            gh release edit "$TAG" --title "AGI Assistant $VN" --notes-file out/RELEASE_NOTES.md --latest --draft=false --prerelease=false
            gh release upload "$TAG" "out/$APK_NAME" "out/$APK_NAME.sha256" --clobber
          else
            echo "Creating release $TAG at $GITHUB_SHA." | tee -a "$S"
            gh release create "$TAG" "out/$APK_NAME" "out/$APK_NAME.sha256" \
              --target "$GITHUB_SHA" --title "AGI Assistant $VN" --notes-file out/RELEASE_NOTES.md --latest
          fi
          # Verify what the app will see: /releases/latest must be this tag with both assets.
          sleep 5
          LATEST=$(gh api "repos/$GH_REPO/releases/latest")
          LT=$(echo "$LATEST" | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')
          ASSETS=$(echo "$LATEST" | python3 -c 'import json,sys; print("\n".join(a["name"]+" "+a["state"]+" "+str(a["size"]) for a in json.load(sys.stdin)["assets"]))')
          BODY_OK=$(echo "$LATEST" | python3 -c 'import json,sys; b=json.load(sys.stdin)["body"]; print("yes" if "versionCode: '"$VC"'" in b and "sha256: '"$SHA"'" in b else "no")')
          { echo "latest tag: $LT"; echo "assets:"; echo "$ASSETS"; echo "notes markers present: $BODY_OK"; } | tee -a "$S"
          [ "$LT" = "$TAG" ] || { echo "::error::/releases/latest is $LT, expected $TAG"; exit 1; }
          echo "$ASSETS" | grep -q "^$APK_NAME uploaded " || { echo "::error::APK asset missing from release"; exit 1; }
          echo "$ASSETS" | grep -q "^$APK_NAME.sha256 uploaded " || { echo "::error::checksum asset missing from release"; exit 1; }
          [ "$BODY_OK" = "yes" ] || { echo "::error::release notes lack versionCode/sha256 markers"; exit 1; }
          # Download the published APK the way the app does and compare the digest.
          curl -fsSL -o /tmp/published.apk "https://github.com/$GH_REPO/releases/download/$TAG/$APK_NAME"
          PUB=$(sha256sum /tmp/published.apk | cut -d' ' -f1)
          [ "$PUB" = "$SHA" ] || { echo "::error::published APK sha256 $PUB != built $SHA"; exit 1; }
          echo "::notice title=GitHub Release::$TAG published – $APK_NAME ($PUB) + $APK_NAME.sha256"
          echo "✅ published $TAG; downloaded asset digest matches" >> "$S"

      - name: Upload verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-diagnostics
          path: diag/
          if-no-files-found: ignore

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-release.html
          if-no-files-found: ignore

      - name: Remove temporary keystore
        if: always()
        shell: bash
        run: |
          if [ -n "${AGI_RELEASE_KEYSTORE_FILE:-}" ] && [ -f "$AGI_RELEASE_KEYSTORE_FILE" ]; then
            shred -u "$AGI_RELEASE_KEYSTORE_FILE" 2>/dev/null || rm -f "$AGI_RELEASE_KEYSTORE_FILE"
          fi
          echo "Temporary keystore removed."
